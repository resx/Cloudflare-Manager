version: '3.8'

services:
  # 前端服务 - Vue 3 应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cf-manager-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - ./frontend/dist:/app/dist:ro
    networks:
      - cf-network
    labels:
      - "com.cloudflare-manager.service=frontend"

  # 后端服务 - Rust API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cf-manager-backend
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - HOST=0.0.0.0
      - PORT=8080
    networks:
      - cf-network
    labels:
      - "com.cloudflare-manager.service=backend"

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: cf-manager-nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cf-network
    labels:
      - "com.cloudflare-manager.service=nginx"

networks:
  cf-network:
    driver: bridge
