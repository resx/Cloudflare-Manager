version: '3.8'

services:
  # 前端服务 - Vue 3 应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cf-manager-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - cf-network
    labels:
      - "com.cloudflare-manager.service=frontend"

  # 后端服务 - Rust API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cf-manager-backend
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - HOST=0.0.0.0
      - PORT=8080
    networks:
      - cf-network
    labels:
      - "com.cloudflare-manager.service=backend"

networks:
  cf-network:
    driver: bridge
