version: '3.8'

services:
  # 统一应用服务（前端 + 后端 + nginx）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cf-manager-app
    restart: unless-stopped
    ports:
      # 只需要暴露一个端口
      - "3000:80"
    environment:
      # 后端环境变量
      - RUST_LOG=info
      - HOST=127.0.0.1
      - PORT=8080
    labels:
      - "com.cloudflare-manager.service=unified-app"
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: cf-network
