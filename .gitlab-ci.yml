# 使用最新版 Docker CLI，自动适配宿主机的 Docker API 版本
image: docker:cli

# 全局变量配置
variables:
  # 移除 DOCKER_HOST，让 CLI 自动通过 /var/run/docker.sock 连接宿主机
  # 移除 DOCKER_TLS_CERTDIR，Socket 连接不需要 TLS
  
  # 使用 overlay2 驱动以获得最佳性能
  DOCKER_DRIVER: overlay2
  # 镜像命名规则
  APP_IMAGE: $CI_REGISTRY_IMAGE

# 定义构建阶段
stages:
  - build

# 构建统一镜像任务
build_image:
  stage: build
  before_script:
    # 调试命令：打印版本
    - docker --version
    # 这里会显示宿主机的信息（验证 Socket 挂载是否成功）
    - docker info
    # 登录到 GitLab Container Registry
    - echo "Logging in to $CI_REGISTRY..."
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    # 构建统一镜像（前端 + 后端 + nginx）
    - echo "Building unified application image (frontend + backend + nginx)..."
    # 直接在宿主机构建，速度更快，且利用宿主机缓存
    - docker build -t $APP_IMAGE:$CI_COMMIT_SHA .
    - docker tag $APP_IMAGE:$CI_COMMIT_SHA $APP_IMAGE:latest

    # 如果是主分支，也打上 stable 标签
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        echo "Tagging as stable version..."
        docker tag $APP_IMAGE:$CI_COMMIT_SHA $APP_IMAGE:stable
      fi

    # 推送镜像到 Registry
    - echo "Pushing image to registry..."
    - docker push $APP_IMAGE:$CI_COMMIT_SHA
    - docker push $APP_IMAGE:latest
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        docker push $APP_IMAGE:stable
      fi

    # 显示镜像信息
    - echo "Build completed successfully!"
    - echo "Image tags:"
    - echo "  - $APP_IMAGE:$CI_COMMIT_SHA"
    - echo "  - $APP_IMAGE:latest"
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        echo "  - $APP_IMAGE:stable"
      fi
  only:
    - main
    - develop
    - tags
  after_script:
    # 可选：清理旧的 Docker 镜像和容器（注意：这会清理宿主机上的未被引用的资源）
    - docker system prune -f || true