# 使用明确的 Docker CLI 版本（避免镜像冲突）
image: docker:24.0.7-cli

# 全局变量配置
variables:
  # 显式禁用 TLS，防止证书生成失败导致连接被拒
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"
  # 使用 overlay2 驱动以获得最佳性能
  DOCKER_DRIVER: overlay2
  # 镜像命名规则
  APP_IMAGE: $CI_REGISTRY_IMAGE

# Docker-in-Docker 服务配置
services:
  - name: docker:24.0.7-dind  # 明确使用服务端镜像
    alias: docker
    # 显式关闭 TLS 验证，并开启 MTU 调整（防止大包丢包）
    command: ["--tls=false", "--storage-driver=overlay2", "--mtu=1400"]

# 定义构建阶段
stages:
  - build

# 构建统一镜像任务
build_image:
  stage: build
  before_script:
    # 调试命令：打印版本确保分离成功
    - docker --version
    - docker info
    # 登录到 GitLab Container Registry
    - echo "Logging in to $CI_REGISTRY..."
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    # 构建统一镜像（前端 + 后端 + nginx）
    - echo "Building unified application image (frontend + backend + nginx)..."
    - docker build -t $APP_IMAGE:$CI_COMMIT_SHA .
    - docker tag $APP_IMAGE:$CI_COMMIT_SHA $APP_IMAGE:latest

    # 如果是主分支，也打上 stable 标签
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        echo "Tagging as stable version..."
        docker tag $APP_IMAGE:$CI_COMMIT_SHA $APP_IMAGE:stable
      fi

    # 推送镜像到 Registry
    - echo "Pushing image to registry..."
    - docker push $APP_IMAGE:$CI_COMMIT_SHA
    - docker push $APP_IMAGE:latest
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        docker push $APP_IMAGE:stable
      fi

    # 显示镜像信息
    - echo "Build completed successfully!"
    - echo "Image tags:"
    - echo "  - $APP_IMAGE:$CI_COMMIT_SHA"
    - echo "  - $APP_IMAGE:latest"
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        echo "  - $APP_IMAGE:stable"
      fi
  only:
    - main
    - develop
    - tags
  after_script:
    # 可选：清理旧的 Docker 镜像和容器
    - docker system prune -f || true
